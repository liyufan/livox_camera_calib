# Data path. adjust them!
common:
    image_path:  "$(find livox_camera_calib)/data/image"
    image_extension:  ".bmp"
    pcd_path:  "$(find livox_camera_calib)/data/pcd"
    pcd_extension:  ".pcd"
    result_path:  "$(find livox_camera_calib)/data/extrinsic.txt"
    data_num: 3
# Camera Parameters. Adjust them!
camera:
    camera_matrix: [1704.1857 , 0.0,      886.5115,
                    0.0,     1719.5228,  467.9244,
                    0.0,     0.0,      1.0     ]
    dist_coeffs: [-0.0963, 0.0708, 0.0011, -0.0017, 0.000000]

# Calibration Parameters.!
calib:
    calib_config_file: "$(find livox_camera_calib)/config/config_outdoor.yaml"
    use_rough_calib: true # set true if your initial_extrinsic is bad
